services:
  sim-api:
    build:
      context: .
      dockerfile: apps/simulator-api/Dockerfile
    container_name: delta-acr-sim-api
    environment:
      NODE_ENV: production
      API_PORT: 4000
      SIM_DATA_DIR: /data
      SIM_PUBLISHER_MODE: ${SIM_PUBLISHER_MODE:-DRY_RUN}
      SIM_SOURCE_SYSTEM_ID: ${SIM_SOURCE_SYSTEM_ID:-sim-air-situation-001}
      SIM_ADAPTER_VERSION: ${SIM_ADAPTER_VERSION:-0.1.0}
      MAIN_COP_BASE_URL: ${MAIN_COP_BASE_URL:-http://sim-api:4000/mock-cop}
      MAIN_COP_BEARER_TOKEN: ${MAIN_COP_BEARER_TOKEN:-dev-lab-token}
      EXTERNAL_AI_ALLOWED: ${EXTERNAL_AI_ALLOWED:-false}
    volumes:
      - sim-data:/data
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  flight-data-api:
    build:
      context: .
      dockerfile: apps/flight-data-api/Dockerfile
    container_name: delta-acr-flight-data-api
    environment:
      NODE_ENV: production
      FLIGHT_DATA_API_PORT: 4010
      FLIGHT_DATA_DIR: /data
      FLIGHT_DATA_ENABLED_SOURCES: ${FLIGHT_DATA_ENABLED_SOURCES:-mock}
      FLIGHT_DATA_DEFAULT_LAT: ${FLIGHT_DATA_DEFAULT_LAT:-50.1008}
      FLIGHT_DATA_DEFAULT_LON: ${FLIGHT_DATA_DEFAULT_LON:-14.2632}
      FLIGHT_DATA_DEFAULT_RADIUS_NM: ${FLIGHT_DATA_DEFAULT_RADIUS_NM:-120}
      FLIGHT_DATA_REQUEST_TIMEOUT_MS: ${FLIGHT_DATA_REQUEST_TIMEOUT_MS:-6000}
      FLIGHT_DATA_CACHE_TTL_SECONDS: ${FLIGHT_DATA_CACHE_TTL_SECONDS:-15}
      FLIGHT_DATA_STALE_IF_ERROR_SECONDS: ${FLIGHT_DATA_STALE_IF_ERROR_SECONDS:-60}
      FLIGHT_DATA_CACHE_MAX_ENTRIES: ${FLIGHT_DATA_CACHE_MAX_ENTRIES:-512}
      FLIGHT_DATA_STALE_AFTER_SECONDS: ${FLIGHT_DATA_STALE_AFTER_SECONDS:-120}
      ADSB_LOL_BASE_URL: ${ADSB_LOL_BASE_URL:-https://api.adsb.lol}
      OPENSKY_BASE_URL: ${OPENSKY_BASE_URL:-https://opensky-network.org/api}
      OPENSKY_AUTH_URL: ${OPENSKY_AUTH_URL:-https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token}
      OPENSKY_ACCESS_TOKEN: ${OPENSKY_ACCESS_TOKEN:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      LOCAL_ADSB_AIRCRAFT_JSON_URLS: ${LOCAL_ADSB_AIRCRAFT_JSON_URLS:-}
      OURAIRPORTS_ENABLED: ${OURAIRPORTS_ENABLED:-true}
      OURAIRPORTS_AIRPORTS_CSV_URL: ${OURAIRPORTS_AIRPORTS_CSV_URL:-https://davidmegginson.github.io/ourairports-data/airports.csv}
      OURAIRPORTS_COUNTRIES: ${OURAIRPORTS_COUNTRIES:-CZ,SK,AT,DE,PL,HU}
      OURAIRPORTS_CACHE_TTL_SECONDS: ${OURAIRPORTS_CACHE_TTL_SECONDS:-86400}
    volumes:
      - flight-data:/data
    expose:
      - "4010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  situation-data-api:
    build:
      context: .
      dockerfile: apps/situation-data-api/Dockerfile
    container_name: delta-acr-situation-data-api
    environment:
      NODE_ENV: production
      SITUATION_DATA_API_PORT: 4020
      SITUATION_DATA_DIR: /data
      SITUATION_DATA_ENABLED_SOURCES: ${SITUATION_DATA_ENABLED_SOURCES:-open_meteo,aviation_weather,ctu_nettest,pid_gtfs_rt,safety_data}
      SITUATION_DATA_DEFAULT_BBOX: ${SITUATION_DATA_DEFAULT_BBOX:-13.85,49.65,15.35,50.45}
      SITUATION_DATA_REQUEST_TIMEOUT_MS: ${SITUATION_DATA_REQUEST_TIMEOUT_MS:-6000}
      SITUATION_DATA_CACHE_TTL_SECONDS: ${SITUATION_DATA_CACHE_TTL_SECONDS:-30}
      SITUATION_DATA_STALE_IF_ERROR_SECONDS: ${SITUATION_DATA_STALE_IF_ERROR_SECONDS:-1800}
      SITUATION_DATA_CACHE_MAX_ENTRIES: ${SITUATION_DATA_CACHE_MAX_ENTRIES:-10000}
      SITUATION_DATA_BBOX_CACHE_PADDING_DEGREES: ${SITUATION_DATA_BBOX_CACHE_PADDING_DEGREES:-0.18}
      SITUATION_DATA_STALE_AFTER_SECONDS: ${SITUATION_DATA_STALE_AFTER_SECONDS:-900}
      SITUATION_DATA_OPEN_METEO_CACHE_TTL_SECONDS: ${SITUATION_DATA_OPEN_METEO_CACHE_TTL_SECONDS:-600}
      SITUATION_DATA_OPEN_METEO_GRID_DEGREES: ${SITUATION_DATA_OPEN_METEO_GRID_DEGREES:-0.05}
      SITUATION_DATA_OSM_POSTGIS_CACHE_TTL_SECONDS: ${SITUATION_DATA_OSM_POSTGIS_CACHE_TTL_SECONDS:-21600}
      SITUATION_DATA_OVERPASS_CACHE_TTL_SECONDS: ${SITUATION_DATA_OVERPASS_CACHE_TTL_SECONDS:-21600}
      SITUATION_DATA_SAFETY_CACHE_TTL_SECONDS: ${SITUATION_DATA_SAFETY_CACHE_TTL_SECONDS:-300}
      SITUATION_DATA_AVIATION_WEATHER_CACHE_TTL_SECONDS: ${SITUATION_DATA_AVIATION_WEATHER_CACHE_TTL_SECONDS:-600}
      SITUATION_DATA_ARDOS_CACHE_TTL_SECONDS: ${SITUATION_DATA_ARDOS_CACHE_TTL_SECONDS:-15}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      OSM_POSTGIS_DATABASE_URL: ${OSM_POSTGIS_DATABASE_URL:-postgresql://sim_osm:sim_osm_dev@osm-postgis:5432/sim_osm}
      OSM_POSTGIS_TABLE: ${OSM_POSTGIS_TABLE:-public.osm_poi}
      OVERPASS_BASE_URL: ${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_MAX_BBOX_DEGREES: ${OVERPASS_MAX_BBOX_DEGREES:-1.6}
      CTU_NETTEST_URL: ${CTU_NETTEST_URL:-https://nettest.ctu.gov.cz/RMBTStatisticServer/export/nettest-opendata_hours-048.zip}
      PID_GTFS_RT_VEHICLE_POSITIONS_URL: ${PID_GTFS_RT_VEHICLE_POSITIONS_URL:-https://api.golemio.cz/v2/vehiclepositions/gtfsrt/vehicle_positions.pb}
      SAFETY_DATA_BASE_URL: ${SAFETY_DATA_BASE_URL:-http://safety-data-api:4030}
      AVIATION_WEATHER_BASE_URL: ${AVIATION_WEATHER_BASE_URL:-https://aviationweather.gov}
      ARDOS_PARTNER_BASE_URL: ${ARDOS_PARTNER_BASE_URL:-}
      ARDOS_PARTNER_TOKEN: ${ARDOS_PARTNER_TOKEN:-}
    volumes:
      - situation-data:/data
    expose:
      - "4020"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4020/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  osm-postgis:
    profiles: ["osm"]
    image: postgis/postgis:16-3.5
    container_name: delta-acr-osm-postgis
    environment:
      POSTGRES_DB: ${OSM_POSTGIS_DB:-sim_osm}
      POSTGRES_USER: ${OSM_POSTGIS_USER:-sim_osm}
      POSTGRES_PASSWORD: ${OSM_POSTGIS_PASSWORD:-sim_osm_dev}
    volumes:
      - osm-postgis-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  osm-importer:
    profiles: ["osm-import"]
    image: iboates/osm2pgsql:latest
    container_name: delta-acr-osm-importer
    depends_on:
      osm-postgis:
        condition: service_healthy
    volumes:
      - ./data/osm-import:/import
    entrypoint: ["osm2pgsql"]

  safety-data-api:
    build:
      context: .
      dockerfile: apps/safety-data-api/Dockerfile
    container_name: delta-acr-safety-data-api
    environment:
      NODE_ENV: production
      SAFETY_DATA_API_PORT: 4030
      SAFETY_DATA_DIR: /data
      SAFETY_DATA_ENABLED_SOURCES: ${SAFETY_DATA_ENABLED_SOURCES:-chmi_alerts,chmi_hydro}
      SAFETY_DATA_DEFAULT_BBOX: ${SAFETY_DATA_DEFAULT_BBOX:-11.8,48.5,19.2,51.2}
      SAFETY_DATA_REQUEST_TIMEOUT_MS: ${SAFETY_DATA_REQUEST_TIMEOUT_MS:-8000}
      SAFETY_DATA_CACHE_TTL_SECONDS: ${SAFETY_DATA_CACHE_TTL_SECONDS:-300}
      SAFETY_DATA_STALE_IF_ERROR_SECONDS: ${SAFETY_DATA_STALE_IF_ERROR_SECONDS:-3600}
      SAFETY_DATA_CACHE_MAX_ENTRIES: ${SAFETY_DATA_CACHE_MAX_ENTRIES:-512}
      SAFETY_DATA_STALE_AFTER_SECONDS: ${SAFETY_DATA_STALE_AFTER_SECONDS:-3600}
      CHMI_ALERTS_CAP_BASE_URL: ${CHMI_ALERTS_CAP_BASE_URL:-https://opendata.chmi.cz/meteorology/weather/alerts/cap/}
      CHMI_HYDRO_METADATA_URL: ${CHMI_HYDRO_METADATA_URL:-https://opendata.chmi.cz/hydrology/historical/metadata/meta1.json}
      CHMI_HYDRO_NOW_BASE_URL: ${CHMI_HYDRO_NOW_BASE_URL:-https://opendata.chmi.cz/hydrology/now/data}
      CHMI_HYDRO_MAX_STATIONS: ${CHMI_HYDRO_MAX_STATIONS:-80}
    volumes:
      - safety-data:/data
    expose:
      - "4030"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4030/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  sim-web:
    build:
      context: .
      dockerfile: apps/simulator-web/Dockerfile
      args:
        VITE_COP_DISPLAY_URL: ${VITE_COP_DISPLAY_URL:-https://cop.zeleznalady.cz}
    container_name: delta-acr-sim-web
    depends_on:
      sim-api:
        condition: service_healthy
      flight-data-api:
        condition: service_healthy
      situation-data-api:
        condition: service_healthy
      safety-data-api:
        condition: service_healthy
    ports:
      - "${SIM_WEB_PORT:-5020}:80"
    restart: unless-stopped

volumes:
  sim-data:
  flight-data:
  situation-data:
  safety-data:
  osm-postgis-data:
