services:
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: csm-sim-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "13133"
    restart: unless-stopped

  sim-api:
    build:
      context: .
      dockerfile: apps/simulator-api/Dockerfile
    container_name: csm-sim-api
    environment:
      NODE_ENV: production
      OTEL_SDK_DISABLED: ${SIM_OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SIM_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      API_PORT: 4000
      SIM_DATA_DIR: /data
      SIM_PUBLISHER_MODE: ${SIM_PUBLISHER_MODE:-DRY_RUN}
      SIM_SOURCE_SYSTEM_ID: ${SIM_SOURCE_SYSTEM_ID:-sim-air-situation-001}
      SIM_ADAPTER_VERSION: ${SIM_ADAPTER_VERSION:-0.1.0}
      MAIN_COP_BASE_URL: ${MAIN_COP_BASE_URL:-http://sim-api:4000/mock-cop}
      MAIN_COP_BEARER_TOKEN: ${MAIN_COP_BEARER_TOKEN:-dev-lab-token}
      EXTERNAL_AI_ALLOWED: ${EXTERNAL_AI_ALLOWED:-false}
      SIM_API_PUBLIC_READ: ${SIM_API_PUBLIC_READ:-false}
      SIM_API_AUTH_REQUIRED: ${SIM_API_AUTH_REQUIRED:-true}
      SIM_API_AUTH_MODE: ${SIM_API_AUTH_MODE:-token}
      SIM_API_ADMIN_TOKEN: ${SIM_API_ADMIN_TOKEN:?Set SIM_API_ADMIN_TOKEN to a high-entropy SIM API bearer token}
      SIM_API_INTERNAL_TOKEN: ${SIM_API_INTERNAL_TOKEN:-}
      SIM_API_TOKENS: ${SIM_API_TOKENS:-}
      SIM_OIDC_ISSUER: ${SIM_OIDC_ISSUER:-}
      SIM_OIDC_JWKS_URI: ${SIM_OIDC_JWKS_URI:-}
      SIM_OIDC_CLIENT_ID: ${SIM_OIDC_CLIENT_ID:-csm-sim-web}
      SIM_OIDC_ALLOWED_CLIENTS: ${SIM_OIDC_ALLOWED_CLIENTS:-csm-sim-web}
      SIM_API_CORS_ORIGINS: ${SIM_API_CORS_ORIGINS:-}
      SIM_API_RATE_LIMIT_WINDOW_MS: ${SIM_API_RATE_LIMIT_WINDOW_MS:-60000}
      SIM_API_RATE_LIMIT_MAX_REQUESTS: ${SIM_API_RATE_LIMIT_MAX_REQUESTS:-300}
      SIM_SCENARIO_MAX_BLOCKS: ${SIM_SCENARIO_MAX_BLOCKS:-24}
      SIM_SCENARIO_MAX_ACTIVE_OBJECTS: ${SIM_SCENARIO_MAX_ACTIVE_OBJECTS:-1000}
      SIM_SCENARIO_MAX_EVENTS_PER_SECOND: ${SIM_SCENARIO_MAX_EVENTS_PER_SECOND:-1000}
      SIM_OPERATIONS_PROVIDER_TIMEOUT_MS: ${SIM_OPERATIONS_PROVIDER_TIMEOUT_MS:-5000}
      SIM_OPERATIONS_FLIGHT_DATA_BASE_URL: ${SIM_OPERATIONS_FLIGHT_DATA_BASE_URL:-http://flight-data-api:4010}
      SIM_OPERATIONS_SITUATION_DATA_BASE_URL: ${SIM_OPERATIONS_SITUATION_DATA_BASE_URL:-http://situation-data-api:4020}
      SIM_OPERATIONS_SAFETY_DATA_BASE_URL: ${SIM_OPERATIONS_SAFETY_DATA_BASE_URL:-http://safety-data-api:4030}
      SIM_OPERATIONS_TAK_GATEWAY_BASE_URL: ${SIM_OPERATIONS_TAK_GATEWAY_BASE_URL:-http://tak-gateway-api:4040}
      SIM_OPERATIONS_REPORT_FILE: ${SIM_OPERATIONS_REPORT_FILE:-}
    volumes:
      - sim-data:/data
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  flight-data-api:
    build:
      context: .
      dockerfile: apps/flight-data-api/Dockerfile
    container_name: csm-sim-flight-data-api
    environment:
      NODE_ENV: production
      OTEL_SDK_DISABLED: ${SIM_OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SIM_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      FLIGHT_DATA_API_PORT: 4010
      FLIGHT_DATA_DIR: /data
      FLIGHT_DATA_ENABLED_SOURCES: ${FLIGHT_DATA_ENABLED_SOURCES:-mock}
      FLIGHT_DATA_DEFAULT_LAT: ${FLIGHT_DATA_DEFAULT_LAT:-50.1008}
      FLIGHT_DATA_DEFAULT_LON: ${FLIGHT_DATA_DEFAULT_LON:-14.2632}
      FLIGHT_DATA_DEFAULT_RADIUS_NM: ${FLIGHT_DATA_DEFAULT_RADIUS_NM:-120}
      FLIGHT_DATA_REQUEST_TIMEOUT_MS: ${FLIGHT_DATA_REQUEST_TIMEOUT_MS:-6000}
      FLIGHT_DATA_CACHE_TTL_SECONDS: ${FLIGHT_DATA_CACHE_TTL_SECONDS:-15}
      FLIGHT_DATA_BBOX_CACHE_GRID_DEGREES: ${FLIGHT_DATA_BBOX_CACHE_GRID_DEGREES:-0.1}
      FLIGHT_DATA_BBOX_CACHE_PADDING_DEGREES: ${FLIGHT_DATA_BBOX_CACHE_PADDING_DEGREES:-0.08}
      FLIGHT_DATA_STALE_IF_ERROR_SECONDS: ${FLIGHT_DATA_STALE_IF_ERROR_SECONDS:-60}
      FLIGHT_DATA_CACHE_MAX_ENTRIES: ${FLIGHT_DATA_CACHE_MAX_ENTRIES:-512}
      FLIGHT_DATA_STALE_AFTER_SECONDS: ${FLIGHT_DATA_STALE_AFTER_SECONDS:-120}
      FLIGHT_DATA_CORS_ORIGINS: ${FLIGHT_DATA_CORS_ORIGINS:-}
      ADSB_LOL_BASE_URL: ${ADSB_LOL_BASE_URL:-https://api.adsb.lol}
      OPENSKY_BASE_URL: ${OPENSKY_BASE_URL:-https://opensky-network.org/api}
      OPENSKY_AUTH_URL: ${OPENSKY_AUTH_URL:-https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token}
      OPENSKY_ACCESS_TOKEN: ${OPENSKY_ACCESS_TOKEN:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      LOCAL_ADSB_AIRCRAFT_JSON_URLS: ${LOCAL_ADSB_AIRCRAFT_JSON_URLS:-}
      FLIGHT_DATA_PARTNER_INGEST_TOKEN: ${FLIGHT_DATA_PARTNER_INGEST_TOKEN:-}
      FLIGHT_DATA_PARTNER_TRACK_TTL_SECONDS: ${FLIGHT_DATA_PARTNER_TRACK_TTL_SECONDS:-90}
      FLIGHT_DATA_PARTNER_TRACK_MAX_RECORDS: ${FLIGHT_DATA_PARTNER_TRACK_MAX_RECORDS:-20000}
      FLIGHT_DATA_PARTNER_TRACK_PRIORITY: ${FLIGHT_DATA_PARTNER_TRACK_PRIORITY:-95}
      FLIGHT_DATA_SENSOR_NODE_INGEST_TOKEN: ${FLIGHT_DATA_SENSOR_NODE_INGEST_TOKEN:-}
      FLIGHT_DATA_SENSOR_NODE_STATUS_TTL_SECONDS: ${FLIGHT_DATA_SENSOR_NODE_STATUS_TTL_SECONDS:-900}
      FLIGHT_DATA_SENSOR_NODE_MAX_NODES: ${FLIGHT_DATA_SENSOR_NODE_MAX_NODES:-1000}
      FLIGHT_DATA_TAK_COT_EXPORT_TOKEN: ${FLIGHT_DATA_TAK_COT_EXPORT_TOKEN:-}
      FLIGHT_DATA_TAK_COT_EXPORT_STALE_SECONDS: ${FLIGHT_DATA_TAK_COT_EXPORT_STALE_SECONDS:-180}
      OURAIRPORTS_ENABLED: ${OURAIRPORTS_ENABLED:-true}
      OURAIRPORTS_AIRPORTS_CSV_URL: ${OURAIRPORTS_AIRPORTS_CSV_URL:-https://davidmegginson.github.io/ourairports-data/airports.csv}
      OURAIRPORTS_COUNTRIES: ${OURAIRPORTS_COUNTRIES:-CZ,SK,AT,DE,PL,HU}
      OURAIRPORTS_CACHE_TTL_SECONDS: ${OURAIRPORTS_CACHE_TTL_SECONDS:-86400}
      AIP_AIRSPACES_ENABLED: ${AIP_AIRSPACES_ENABLED:-true}
      AIP_AIRSPACES_SOURCE_URL: ${AIP_AIRSPACES_SOURCE_URL:-https://aim.rlp.cz/eaip/html/eAIP/LK-ENR-5.1-en-GB.html}
      AIP_AIRSPACES_CACHE_TTL_SECONDS: ${AIP_AIRSPACES_CACHE_TTL_SECONDS:-86400}
      UAS_GEOZONES_ENABLED: ${UAS_GEOZONES_ENABLED:-true}
      UAS_GEOZONES_CATALOG_URL: ${UAS_GEOZONES_CATALOG_URL:-https://aim.rlp.cz/?lang=cz&p=uas-gz}
      UAS_GEOZONES_LAYER_IDS: ${UAS_GEOZONES_LAYER_IDS:-LKR314A,LKR314B,LKR314C,LKR314D,LKR314E,LKR314F,LKR315A,LKR315B,LKR319,LKR320A}
      UAS_GEOZONES_CACHE_TTL_SECONDS: ${UAS_GEOZONES_CACHE_TTL_SECONDS:-86400}
      AIRSPACE_ACTIVATION_ENABLED: ${AIRSPACE_ACTIVATION_ENABLED:-true}
      AIRSPACE_ACTIVATION_BASE_URL: ${AIRSPACE_ACTIVATION_BASE_URL:-https://aup.rlp.cz/}
      AIRSPACE_ACTIVATION_CACHE_TTL_SECONDS: ${AIRSPACE_ACTIVATION_CACHE_TTL_SECONDS:-300}
    volumes:
      - flight-data:/data
    expose:
      - "4010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  situation-data-cache:
    image: valkey/valkey:8-alpine
    container_name: csm-sim-situation-data-cache
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  situation-data-api:
    build:
      context: .
      dockerfile: apps/situation-data-api/Dockerfile
    container_name: csm-sim-situation-data-api
    depends_on:
      situation-data-cache:
        condition: service_healthy
    environment:
      NODE_ENV: production
      OTEL_SDK_DISABLED: ${SIM_OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SIM_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      SITUATION_DATA_API_PORT: 4020
      SITUATION_DATA_DIR: /data
      SITUATION_DATA_ENABLED_SOURCES: ${SITUATION_DATA_ENABLED_SOURCES:-open_meteo,weather_forecast,aviation_weather,chmi_weather_stations,chmi_weather_radar,chmi_weather_webcams,chmi_air_quality,ctu_nettest,ctu_stationary_mobile,pid_gtfs_rt,public_transit_static,spravazeleznic_trains,road_srti_lod,safety_data}
      SITUATION_DATA_DEFAULT_BBOX: ${SITUATION_DATA_DEFAULT_BBOX:-13.85,49.65,15.35,50.45}
      SITUATION_DATA_REQUEST_TIMEOUT_MS: ${SITUATION_DATA_REQUEST_TIMEOUT_MS:-6000}
      SITUATION_DATA_CACHE_TTL_SECONDS: ${SITUATION_DATA_CACHE_TTL_SECONDS:-30}
      SITUATION_DATA_STALE_IF_ERROR_SECONDS: ${SITUATION_DATA_STALE_IF_ERROR_SECONDS:-1800}
      SITUATION_DATA_CACHE_MAX_ENTRIES: ${SITUATION_DATA_CACHE_MAX_ENTRIES:-10000}
      SITUATION_DATA_SHARED_CACHE_REDIS_URL: ${SITUATION_DATA_SHARED_CACHE_REDIS_URL:-redis://situation-data-cache:6379/0}
      SITUATION_DATA_SHARED_CACHE_KEY_PREFIX: ${SITUATION_DATA_SHARED_CACHE_KEY_PREFIX:-csm-sim:situation-data}
      SITUATION_DATA_SHARED_CACHE_CONNECT_TIMEOUT_MS: ${SITUATION_DATA_SHARED_CACHE_CONNECT_TIMEOUT_MS:-1000}
      SITUATION_DATA_BBOX_CACHE_PADDING_DEGREES: ${SITUATION_DATA_BBOX_CACHE_PADDING_DEGREES:-0.18}
      SITUATION_DATA_STALE_AFTER_SECONDS: ${SITUATION_DATA_STALE_AFTER_SECONDS:-900}
      SITUATION_DATA_OPEN_METEO_CACHE_TTL_SECONDS: ${SITUATION_DATA_OPEN_METEO_CACHE_TTL_SECONDS:-600}
      SITUATION_DATA_OPEN_METEO_GRID_DEGREES: ${SITUATION_DATA_OPEN_METEO_GRID_DEGREES:-0.05}
      SITUATION_DATA_OSM_POSTGIS_CACHE_TTL_SECONDS: ${SITUATION_DATA_OSM_POSTGIS_CACHE_TTL_SECONDS:-21600}
      SITUATION_DATA_OVERPASS_CACHE_TTL_SECONDS: ${SITUATION_DATA_OVERPASS_CACHE_TTL_SECONDS:-21600}
      SITUATION_DATA_SAFETY_CACHE_TTL_SECONDS: ${SITUATION_DATA_SAFETY_CACHE_TTL_SECONDS:-300}
      IDSJMK_VEHICLE_POSITIONS_URL: ${IDSJMK_VEHICLE_POSITIONS_URL:-https://mapa.idsjmk.cz/api/vehicles.json}
      SITUATION_DATA_IDSJMK_CACHE_TTL_SECONDS: ${SITUATION_DATA_IDSJMK_CACHE_TTL_SECONDS:-20}
      SPRAVAZELEZNIC_TRAIN_POSITIONS_URL: ${SPRAVAZELEZNIC_TRAIN_POSITIONS_URL:-https://mapy.spravazeleznic.cz/serverside/request2.php?module=Layers%5COsVlaky&action=load2}
      SITUATION_DATA_SPRAVAZELEZNIC_TRAINS_CACHE_TTL_SECONDS: ${SITUATION_DATA_SPRAVAZELEZNIC_TRAINS_CACHE_TTL_SECONDS:-900}
      ROAD_SRTI_LOD_SPARQL_URL: ${ROAD_SRTI_LOD_SPARQL_URL:-https://lod.tamtamresearch.com/sparql/}
      SITUATION_DATA_ROAD_SRTI_CACHE_TTL_SECONDS: ${SITUATION_DATA_ROAD_SRTI_CACHE_TTL_SECONDS:-300}
      ROAD_SRTI_LOD_MAX_RECORDS: ${ROAD_SRTI_LOD_MAX_RECORDS:-1500}
      SITUATION_DATA_AVIATION_WEATHER_CACHE_TTL_SECONDS: ${SITUATION_DATA_AVIATION_WEATHER_CACHE_TTL_SECONDS:-600}
      SITUATION_DATA_CHMI_WEATHER_MAX_STATIONS: ${SITUATION_DATA_CHMI_WEATHER_MAX_STATIONS:-600}
      SITUATION_DATA_CHMI_WEATHER_RADAR_CACHE_TTL_SECONDS: ${SITUATION_DATA_CHMI_WEATHER_RADAR_CACHE_TTL_SECONDS:-300}
      SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_HISTORY_HOURS: ${SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_HISTORY_HOURS:-6}
      SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_MAX_COUNT: ${SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_MAX_COUNT:-72}
      SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_STORE_ENABLED: ${SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_STORE_ENABLED:-false}
      SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_STORE_DIR: ${SITUATION_DATA_CHMI_WEATHER_RADAR_FRAME_STORE_DIR:-/data/weather-radar-frames}
      SITUATION_DATA_CHMI_WEATHER_RADAR_CLEAN_CROP_INSET_PIXELS: ${SITUATION_DATA_CHMI_WEATHER_RADAR_CLEAN_CROP_INSET_PIXELS:-2}
      CHMI_WEATHER_RADAR_BASE_URL: ${CHMI_WEATHER_RADAR_BASE_URL:-https://opendata.chmi.cz/meteorology/weather/radar/composite/}
      SITUATION_DATA_CHMI_WEATHER_WEBCAMS_CACHE_TTL_SECONDS: ${SITUATION_DATA_CHMI_WEATHER_WEBCAMS_CACHE_TTL_SECONDS:-300}
      CHMI_WEATHER_WEBCAMS_MAP_URL: ${CHMI_WEATHER_WEBCAMS_MAP_URL:-https://data-provider.chmi.cz/api/kamery/data/map}
      CHMI_WEATHER_WEBCAMS_DATA_BASE_URL: ${CHMI_WEATHER_WEBCAMS_DATA_BASE_URL:-https://data-provider.chmi.cz}
      CHMI_WEATHER_WEBCAMS_PUBLIC_BASE_URL: ${CHMI_WEATHER_WEBCAMS_PUBLIC_BASE_URL:-https://www.chmi.cz}
      SITUATION_DATA_ARDOS_CACHE_TTL_SECONDS: ${SITUATION_DATA_ARDOS_CACHE_TTL_SECONDS:-15}
      SITUATION_DATA_MOBILE_NETWORK_CACHE_TTL_SECONDS: ${SITUATION_DATA_MOBILE_NETWORK_CACHE_TTL_SECONDS:-3600}
      SITUATION_DATA_MOBILE_COVERAGE_CACHE_TTL_SECONDS: ${SITUATION_DATA_MOBILE_COVERAGE_CACHE_TTL_SECONDS:-21600}
      SITUATION_DATA_RADIO_PLANNING_CACHE_TTL_SECONDS: ${SITUATION_DATA_RADIO_PLANNING_CACHE_TTL_SECONDS:-900}
      SITUATION_DATA_RADIO_PLANNING_CACHE_MAX_ENTRIES: ${SITUATION_DATA_RADIO_PLANNING_CACHE_MAX_ENTRIES:-512}
      SEARCH_DATA_CACHE_TTL_SECONDS: ${SEARCH_DATA_CACHE_TTL_SECONDS:-300}
      SEARCH_DATA_CACHE_MAX_ENTRIES: ${SEARCH_DATA_CACHE_MAX_ENTRIES:-256}
      SEARCH_DATA_MAX_LIMIT: ${SEARCH_DATA_MAX_LIMIT:-5000}
      MOBILE_COVERAGE_RESOLUTION_M: ${MOBILE_COVERAGE_RESOLUTION_M:-1000}
      MOBILE_COVERAGE_MAX_CELLS: ${MOBILE_COVERAGE_MAX_CELLS:-1000}
      MOBILE_COVERAGE_MODEL_VERSION: ${MOBILE_COVERAGE_MODEL_VERSION:-coverage-v1}
      MOBILE_COVERAGE_DEM_SOURCE: ${MOBILE_COVERAGE_DEM_SOURCE:-not-used-phase-1}
      MOBILE_COVERAGE_TERRAIN_AWARE: ${MOBILE_COVERAGE_TERRAIN_AWARE:-false}
      MOBILE_COVERAGE_DEFAULT_ANTENNA_HEIGHT_M: ${MOBILE_COVERAGE_DEFAULT_ANTENNA_HEIGHT_M:-30}
      MOBILE_COVERAGE_READ_MODEL_ENABLED: ${MOBILE_COVERAGE_READ_MODEL_ENABLED:-true}
      MOBILE_COVERAGE_READ_MODEL_TABLE: ${MOBILE_COVERAGE_READ_MODEL_TABLE:-public.mobile_coverage_cells}
      MOBILE_COVERAGE_READ_MODEL_MAX_AGE_SECONDS: ${MOBILE_COVERAGE_READ_MODEL_MAX_AGE_SECONDS:-604800}
      DEM_ENABLED: ${DEM_ENABLED:-false}
      DEM_DATASET_ID: ${DEM_DATASET_ID:-copernicus-glo30-cz}
      DEM_POSTGIS_DATABASE_URL: ${DEM_POSTGIS_DATABASE_URL:-}
      DEM_LOCAL_CACHE_DIR: ${DEM_LOCAL_CACHE_DIR:-/dem-cache/copernicus-glo30}
      DEM_SEAWEEDFS_S3_ENDPOINT: ${DEM_SEAWEEDFS_S3_ENDPOINT:-}
      DEM_SEAWEEDFS_BUCKET: ${DEM_SEAWEEDFS_BUCKET:-sim-dem}
      DEM_SEAWEEDFS_PREFIX: ${DEM_SEAWEEDFS_PREFIX:-copernicus-glo30/2021}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      OSM_POSTGIS_BACKEND: ${OSM_POSTGIS_BACKEND:-}
      OSM_POSTGIS_DATABASE_URL: ${OSM_POSTGIS_DATABASE_URL:-}
      OSM_POSTGIS_TABLE: ${OSM_POSTGIS_TABLE:-public.osm_poi}
      OSM_POSTGIS_ADMIN_BOUNDARY_TABLE: ${OSM_POSTGIS_ADMIN_BOUNDARY_TABLE:-public.osm_admin_boundary}
      OVERPASS_BASE_URL: ${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_MAX_BBOX_DEGREES: ${OVERPASS_MAX_BBOX_DEGREES:-1.6}
      CTU_NETTEST_URL: ${CTU_NETTEST_URL:-https://nettest.ctu.gov.cz/RMBTStatisticServer/export/nettest-opendata_hours-048.zip}
      CTU_STATIONARY_MOBILE_URLS: ${CTU_STATIONARY_MOBILE_URLS:-}
      SITUATION_DATA_CTU_STATIONARY_MOBILE_CACHE_TTL_SECONDS: ${SITUATION_DATA_CTU_STATIONARY_MOBILE_CACHE_TTL_SECONDS:-86400}
      PID_GTFS_RT_VEHICLE_POSITIONS_URL: ${PID_GTFS_RT_VEHICLE_POSITIONS_URL:-https://api.golemio.cz/v2/vehiclepositions/gtfsrt/vehicle_positions.pb}
      PID_GTFS_STATIC_URL: ${PID_GTFS_STATIC_URL:-https://data.pid.cz/PID_GTFS.zip}
      SITUATION_DATA_PID_GTFS_STATIC_CACHE_TTL_SECONDS: ${SITUATION_DATA_PID_GTFS_STATIC_CACHE_TTL_SECONDS:-21600}
      PUBLIC_TRANSIT_STATIC_GTFS_FEEDS: "${PUBLIC_TRANSIT_STATIC_GTFS_FEEDS:-pid|PID statický GTFS|https://data.pid.cz/PID_GTFS.zip,idsjmk|IDS JMK statický GTFS|https://kordis-jmk.cz/gtfs/gtfs.zip,dpmo|DPMO Olomouc statický GTFS|https://www.dpmo.cz/doc/dpmo-olomouc-cz.zip,pmdp|PMDP Plzeň statický GTFS|https://jizdnirady.pmdp.cz/jr/gtfs,dpmlj|DPMLJ Liberec/Jablonec statický GTFS|https://www.dpmlj.cz/gtfs.zip}"
      PUBLIC_TRANSIT_STATIC_GEOJSON_FEEDS: "${PUBLIC_TRANSIT_STATIC_GEOJSON_FEEDS:-dpo_ostrava|DPO Ostrava zastávky MHD GeoJSON|https://mapy.ostrava.cz/opendata/data/opendata/zastavky_MHD_WGS84_gjson.zip}"
      SITUATION_DATA_PUBLIC_TRANSIT_STATIC_CACHE_TTL_SECONDS: ${SITUATION_DATA_PUBLIC_TRANSIT_STATIC_CACHE_TTL_SECONDS:-21600}
      PUBLIC_TRANSIT_STATIC_MAX_STOPS: ${PUBLIC_TRANSIT_STATIC_MAX_STOPS:-60000}
      SAFETY_DATA_BASE_URL: ${SAFETY_DATA_BASE_URL:-http://safety-data-api:4030}
      AVIATION_WEATHER_BASE_URL: ${AVIATION_WEATHER_BASE_URL:-https://aviationweather.gov}
      ARDOS_PARTNER_BASE_URL: ${ARDOS_PARTNER_BASE_URL:-}
      ARDOS_PARTNER_TOKEN: ${ARDOS_PARTNER_TOKEN:-}
      SITUATION_DATA_CORS_ORIGINS: ${SITUATION_DATA_CORS_ORIGINS:-}
    volumes:
      - situation-data:/data
      - ${DEM_LOCAL_CACHE_HOST_DIR:-./data/dem-cache/copernicus-glo30}:${DEM_LOCAL_CACHE_DIR:-/dem-cache/copernicus-glo30}:ro
    expose:
      - "4020"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4020/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  osm-postgis:
    profiles: ["osm"]
    image: postgis/postgis:16-3.5
    container_name: csm-sim-osm-postgis
    environment:
      POSTGRES_DB: ${OSM_POSTGIS_DB:-sim_osm}
      POSTGRES_USER: ${OSM_POSTGIS_USER:-sim_osm}
      POSTGRES_PASSWORD: ${OSM_POSTGIS_PASSWORD:-}
    volumes:
      - osm-postgis-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  osm-importer:
    profiles: ["osm-import"]
    image: iboates/osm2pgsql:latest
    container_name: csm-sim-osm-importer
    depends_on:
      osm-postgis:
        condition: service_healthy
    volumes:
      - ./data/osm-import:/import
    entrypoint: ["osm2pgsql"]

  safety-data-api:
    build:
      context: .
      dockerfile: apps/safety-data-api/Dockerfile
    container_name: csm-sim-safety-data-api
    environment:
      NODE_ENV: production
      OTEL_SDK_DISABLED: ${SIM_OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SIM_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      SAFETY_DATA_API_PORT: 4030
      SAFETY_DATA_DIR: /data
      SAFETY_DATA_ENABLED_SOURCES: ${SAFETY_DATA_ENABLED_SOURCES:-chmi_alerts,chmi_hydro,gdacs_alerts,hzs_incidents,municipal_alerts,road_srti_lod,admin_boundaries}
      SAFETY_DATA_DEFAULT_BBOX: ${SAFETY_DATA_DEFAULT_BBOX:-11.8,48.5,19.2,51.2}
      SAFETY_DATA_REQUEST_TIMEOUT_MS: ${SAFETY_DATA_REQUEST_TIMEOUT_MS:-8000}
      SAFETY_DATA_CACHE_TTL_SECONDS: ${SAFETY_DATA_CACHE_TTL_SECONDS:-300}
      SAFETY_DATA_STALE_IF_ERROR_SECONDS: ${SAFETY_DATA_STALE_IF_ERROR_SECONDS:-3600}
      SAFETY_DATA_CACHE_MAX_ENTRIES: ${SAFETY_DATA_CACHE_MAX_ENTRIES:-512}
      SAFETY_DATA_STALE_AFTER_SECONDS: ${SAFETY_DATA_STALE_AFTER_SECONDS:-3600}
      CHMI_ALERTS_CAP_BASE_URL: ${CHMI_ALERTS_CAP_BASE_URL:-https://opendata.chmi.cz/meteorology/weather/alerts/cap/}
      CHMI_ORP_CODELIST_URL: "${CHMI_ORP_CODELIST_URL:-https://apl2.czso.cz/iSMS/do_cis_export?cisjaz=203&cisvaz=61_88&format=2&kodcis=65&separator=,&typdat=1}"
      CHMI_HYDRO_METADATA_URL: ${CHMI_HYDRO_METADATA_URL:-https://opendata.chmi.cz/hydrology/now/metadata/meta1.json}
      CHMI_HYDRO_NOW_BASE_URL: ${CHMI_HYDRO_NOW_BASE_URL:-https://opendata.chmi.cz/hydrology/now/data}
      CHMI_HYDRO_RECENT_BASE_URL: ${CHMI_HYDRO_RECENT_BASE_URL:-https://opendata.chmi.cz/hydrology/recent/data}
      CHMI_HYDRO_MAX_STATIONS: ${CHMI_HYDRO_MAX_STATIONS:-600}
      CHMI_HYDRO_STATION_CACHE_MAX_ENTRIES: ${CHMI_HYDRO_STATION_CACHE_MAX_ENTRIES:-}
      MUNICIPAL_ALERT_FEEDS: ${MUNICIPAL_ALERT_FEEDS:-}
      MUNICIPAL_ALERTS_CACHE_TTL_SECONDS: ${MUNICIPAL_ALERTS_CACHE_TTL_SECONDS:-300}
      CHMI_HYDRO_CURRENT_SNAPSHOT_CACHE_TTL_SECONDS: ${CHMI_HYDRO_CURRENT_SNAPSHOT_CACHE_TTL_SECONDS:-300}
      CHMI_HYDRO_DETAIL_DEFAULT_PAST_HOURS: ${CHMI_HYDRO_DETAIL_DEFAULT_PAST_HOURS:-168}
      CHMI_HYDRO_DETAIL_FORECAST_HOURS: ${CHMI_HYDRO_DETAIL_FORECAST_HOURS:-72}
      CHMI_HYDRO_DETAIL_BACKFILL_DAYS: ${CHMI_HYDRO_DETAIL_BACKFILL_DAYS:-7}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      NASA_FIRMS_AREA_BASE_URL: ${NASA_FIRMS_AREA_BASE_URL:-https://firms.modaps.eosdis.nasa.gov/api/area/csv}
      NASA_FIRMS_SOURCE: ${NASA_FIRMS_SOURCE:-VIIRS_SNPP_NRT}
      NASA_FIRMS_DAY_RANGE: ${NASA_FIRMS_DAY_RANGE:-1}
      GDACS_RSS_URL: ${GDACS_RSS_URL:-https://www.gdacs.org/xml/rss.xml}
      GDACS_CACHE_TTL_SECONDS: ${GDACS_CACHE_TTL_SECONDS:-900}
      HZS_INCIDENTS_FEEDS: "${HZS_INCIDENTS_FEEDS:-https://www.hzspa.cz/vyjezdy/aktualni-vyjezdy.php|HZS Pardubického kraje - aktuální výjezdy|Pardubický kraj|15.78|49.94|15.3,49.45,16.95,50.35|hzs-pardubice}"
      HZS_INCIDENTS_CACHE_TTL_SECONDS: ${HZS_INCIDENTS_CACHE_TTL_SECONDS:-180}
      HZS_INCIDENTS_DETAIL_CACHE_TTL_SECONDS: ${HZS_INCIDENTS_DETAIL_CACHE_TTL_SECONDS:-1800}
      HZS_INCIDENTS_MAX_ACTIVE_DETAILS: ${HZS_INCIDENTS_MAX_ACTIVE_DETAILS:-50}
      ROAD_SRTI_LOD_SPARQL_URL: ${ROAD_SRTI_LOD_SPARQL_URL:-https://lod.tamtamresearch.com/sparql/}
      SAFETY_DATA_ROAD_SRTI_CACHE_TTL_SECONDS: ${SAFETY_DATA_ROAD_SRTI_CACHE_TTL_SECONDS:-300}
      ROAD_SRTI_LOD_MAX_RECORDS: ${ROAD_SRTI_LOD_MAX_RECORDS:-1500}
      OSM_POSTGIS_DATABASE_URL: ${OSM_POSTGIS_DATABASE_URL:-}
      SAFETY_DATA_ADMIN_BOUNDARY_DATABASE_URL: ${SAFETY_DATA_ADMIN_BOUNDARY_DATABASE_URL:-}
      SAFETY_DATA_ADMIN_BOUNDARY_TABLE: ${SAFETY_DATA_ADMIN_BOUNDARY_TABLE:-public.osm_admin_boundary}
      SAFETY_DATA_ADMIN_BOUNDARY_CACHE_TTL_SECONDS: ${SAFETY_DATA_ADMIN_BOUNDARY_CACHE_TTL_SECONDS:-86400}
      SAFETY_DATA_CORS_ORIGINS: ${SAFETY_DATA_CORS_ORIGINS:-}
    volumes:
      - safety-data:/data
    expose:
      - "4030"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4030/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  tak-gateway-api:
    build:
      context: .
      dockerfile: apps/tak-gateway-api/Dockerfile
    container_name: csm-sim-tak-gateway-api
    environment:
      NODE_ENV: production
      OTEL_SDK_DISABLED: ${SIM_OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SIM_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TAK_GATEWAY_API_PORT: 4040
      TAK_GATEWAY_DATA_DIR: /data
      TAK_GATEWAY_INGEST_TOKEN: ${TAK_GATEWAY_INGEST_TOKEN:-dev-tak-ingest-token}
      TAK_GATEWAY_READ_TOKEN: ${TAK_GATEWAY_READ_TOKEN:-}
      TAK_GATEWAY_PUBLIC_READ: ${TAK_GATEWAY_PUBLIC_READ:-false}
      TAK_GATEWAY_DEFAULT_BBOX: ${TAK_GATEWAY_DEFAULT_BBOX:-11.8,48.5,19.2,51.2}
      TAK_GATEWAY_STALE_AFTER_SECONDS: ${TAK_GATEWAY_STALE_AFTER_SECONDS:-300}
      TAK_GATEWAY_RETENTION_SECONDS: ${TAK_GATEWAY_RETENTION_SECONDS:-3600}
      TAK_GATEWAY_MAX_EVENTS: ${TAK_GATEWAY_MAX_EVENTS:-5000}
      TAK_GATEWAY_EXPOSE_RAW: ${TAK_GATEWAY_EXPOSE_RAW:-false}
      TAK_GATEWAY_SOURCE_LABEL: ${TAK_GATEWAY_SOURCE_LABEL:-TAK/CoT gateway}
      TAK_GATEWAY_CORS_ORIGINS: ${TAK_GATEWAY_CORS_ORIGINS:-}
    volumes:
      - tak-gateway-data:/data
    expose:
      - "4040"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4040/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  sim-web:
    build:
      context: .
      dockerfile: apps/simulator-web/Dockerfile
      args:
        VITE_COP_DISPLAY_URL: ${VITE_COP_DISPLAY_URL:-https://cop.zeleznalady.cz}
        SIM_WEB_MODE: ${VITE_SIM_AUTH_MODE:-token}
        VITE_SIM_OIDC_ISSUER: ${VITE_SIM_OIDC_ISSUER:-}
        VITE_SIM_OIDC_CLIENT_ID: ${VITE_SIM_OIDC_CLIENT_ID:-csm-sim-web}
        VITE_SIM_OIDC_SCOPE: ${VITE_SIM_OIDC_SCOPE:-openid profile email}
        VITE_SIM_PUBLIC_READ_ENABLED: ${VITE_SIM_PUBLIC_READ_ENABLED:-false}
        SIM_WEB_ALLOW_MANUAL_LOGIN: ${VITE_SIM_ALLOW_TOKEN_LOGIN:-false}
    container_name: csm-sim-web
    depends_on:
      sim-api:
        condition: service_healthy
      flight-data-api:
        condition: service_healthy
      situation-data-api:
        condition: service_healthy
      safety-data-api:
        condition: service_healthy
      tak-gateway-api:
        condition: service_healthy
    ports:
      - "${SIM_WEB_PORT:-5020}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

volumes:
  sim-data:
  flight-data:
  situation-data:
  safety-data:
  tak-gateway-data:
  osm-postgis-data:
