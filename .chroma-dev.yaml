indexing:
  repo_name: csm-sim
  state_dir: .chroma-state
  include:
    - "README*"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "docs/**/*.md"
    - "openapi/**/*.json"
    - "openapi/**/*.md"
    - ".env.example"
    - ".node-version"
    - ".nvmrc"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - "tsconfig*.json"
    - "vite.config.ts"
    - "Dockerfile*"
    - "docker-compose*.yml"
    - ".github/workflows/**/*.yml"
    - "apps/**/*.ts"
    - "apps/**/*.tsx"
    - "apps/**/*.js"
    - "apps/**/*.jsx"
    - "apps/**/*.css"
    - "packages/**/*.ts"
    - "packages/**/*.tsx"
    - "packages/**/*.js"
    - "packages/**/*.jsx"
    - "packages/**/*.css"
    - "scripts/**/*.rb"
    - "scripts/**/*.sh"
    - "scripts/**/*.js"
    - "scripts/**/*.ts"
    - "deploy/**/*.md"
    - "deploy/**/*.sql"
    - "deploy/**/*.sh"
    - "deploy/**/*.yml"
    - "deploy/**/*.yaml"
  exclude:
    - ".git/**"
    - "**/.git/**"
    - ".chroma-state/**"
    - "**/.chroma-state/**"
    - ".chroma-data/**"
    - "**/.chroma-data/**"
    - ".venv/**"
    - "**/.venv/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - "dist/**"
    - "**/dist/**"
    - "build/**"
    - "**/build/**"
    - ".next/**"
    - "**/.next/**"
    - "coverage/**"
    - "**/coverage/**"
    - "data/**"
    - "**/data/**"
    - "*.log"
    - "**/*.log"
    - ".env"
    - ".env.*"
    - "!.env.example"
    - "docs/archive/openapi-yaml/**"
    - "openapi/openapi.json"
  max_chunk_chars: 1800
  chunk_overlap_chars: 150
