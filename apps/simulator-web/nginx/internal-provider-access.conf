# Server-to-server provider access only.
# The container trusts X-Forwarded-For from internal reverse proxies in
# default.conf, so public clients forwarded by dmz.home.cz are evaluated by
# their original public IP instead of by the DMZ host address.
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 100.64.0.0/10;
allow fc00::/7;
deny all;
