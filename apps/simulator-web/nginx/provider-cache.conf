# Short gateway cache for server-to-server provider GETs.
# It absorbs backend container recreates by serving a recent response instead
# of surfacing transient 502s to COP polling loops.
proxy_cache sim_provider_cache;
proxy_cache_methods GET HEAD;
proxy_cache_key "$scheme|$request_method|$host|$request_uri";
proxy_cache_valid 200 10s;
proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_bypass $http_authorization $arg_nocache;
proxy_no_cache $http_authorization $arg_nocache;
proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
include /etc/nginx/includes/security-headers.conf;
add_header Cache-Control "private, max-age=10" always;
add_header X-SIM-Gateway-Cache $upstream_cache_status always;
