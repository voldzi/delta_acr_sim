server {
  listen 80;
  server_name _;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 100.64.0.0/10;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://sim-api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location /flight-data/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://flight-data-api:4010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /flight-data/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://flight-data-api:4010/health/;
  }

  location /flight-data/metrics {
    return 404;
  }

  location /situation-data/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://situation-data-api:4020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /situation-data/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://situation-data-api:4020/health/;
  }

  location /situation-data/metrics {
    return 404;
  }

  location /safety-data/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://safety-data-api:4030/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /safety-data/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://safety-data-api:4030/health/;
  }

  location /safety-data/metrics {
    return 404;
  }

  location /tak-gateway/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://tak-gateway-api:4040/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /tak-gateway/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://tak-gateway-api:4040/health/;
  }

  location /tak-gateway/metrics {
    return 404;
  }

  location = /health/live {
    proxy_pass http://sim-api:4000/health/live;
  }

  location /health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://sim-api:4000/health/;
  }

  location /metrics {
    return 404;
  }

  location /mock-cop/ {
    return 404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files /site.webmanifest =404;
  }

  location = /docs {
    return 301 /docs/;
  }

  location /docs/ {
    try_files $uri $uri/ /docs/index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location / {
    include /etc/nginx/includes/internal-provider-access.conf;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
