server_tokens off;
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=sim_public_health:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sim_public_static:10m rate=240r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  keepalive_timeout 20s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_request_buffering on;
  proxy_buffering on;

  set $sim_api_upstream sim-api:4000;
  set $flight_data_api_upstream flight-data-api:4010;
  set $situation_data_api_upstream situation-data-api:4020;
  set $safety_data_api_upstream safety-data-api:4030;
  set $tak_gateway_api_upstream tak-gateway-api:4040;

  include /etc/nginx/includes/security-headers.conf;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 100.64.0.0/10;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    limit_req zone=sim_public_static burst=120 nodelay;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /favicon.svg {
    limit_req zone=sim_public_static burst=120 nodelay;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files /favicon.svg =404;
  }

  location /icons/ {
    limit_req zone=sim_public_static burst=120 nodelay;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://$sim_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location /flight-data/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/flight-data/api/?(.*)$ /api/$1 break;
    proxy_pass http://$flight_data_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /flight-data/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/flight-data/health/?(.*)$ /health/$1 break;
    proxy_pass http://$flight_data_api_upstream;
  }

  location /flight-data/metrics {
    return 404;
  }

  location /situation-data/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/situation-data/api/?(.*)$ /api/$1 break;
    proxy_pass http://$situation_data_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /situation-data/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/situation-data/health/?(.*)$ /health/$1 break;
    proxy_pass http://$situation_data_api_upstream;
  }

  location /situation-data/metrics {
    return 404;
  }

  location /safety-data/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/safety-data/api/?(.*)$ /api/$1 break;
    proxy_pass http://$safety_data_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /safety-data/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/safety-data/health/?(.*)$ /health/$1 break;
    proxy_pass http://$safety_data_api_upstream;
  }

  location /safety-data/metrics {
    return 404;
  }

  location /tak-gateway/api/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/tak-gateway/api/?(.*)$ /api/$1 break;
    proxy_pass http://$tak_gateway_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /tak-gateway/health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    rewrite ^/tak-gateway/health/?(.*)$ /health/$1 break;
    proxy_pass http://$tak_gateway_api_upstream;
  }

  location /tak-gateway/metrics {
    return 404;
  }

  location = /health/live {
    limit_req zone=sim_public_health burst=15 nodelay;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "no-store";
    proxy_pass http://$sim_api_upstream;
  }

  location /health/ {
    include /etc/nginx/includes/internal-provider-access.conf;
    proxy_pass http://$sim_api_upstream;
  }

  location /metrics {
    return 404;
  }

  location /mock-cop/ {
    return 404;
  }

  location = /site.webmanifest {
    limit_req zone=sim_public_static burst=120 nodelay;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    default_type application/manifest+json;
    try_files /site.webmanifest =404;
  }

  location = /docs {
    return 301 /docs/;
  }

  location /docs/ {
    limit_req zone=sim_public_static burst=120 nodelay;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri/ /docs/index.html;
  }

  location = /index.html {
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location / {
    include /etc/nginx/includes/internal-provider-access.conf;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
