openapi: 3.1.0
info:
  title: CSM SIM API
  version: 0.1.0
  description: API skeleton pro samostatný SIM systém generující výhradně syntetická data.
servers:
  - url: http://localhost:3000
    description: Lokální vývoj
tags:
  - name: Scenarios
  - name: Runtime
  - name: Faults
  - name: Publisher
  - name: AI
  - name: Operations
  - name: Health
paths:
  /api/v1/scenarios:
    get:
      tags: [Scenarios]
      summary: Vrátí seznam scénářů.
      operationId: listScenarios
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Scenarios]
      summary: Vytvoří scénář.
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/scenario.schema.json'
      responses:
        '201':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}:
    get:
      tags: [Scenarios]
      summary: Vrátí detail scénáře.
      operationId: getScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: './schemas/scenario.schema.json'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Scenarios]
      summary: Upraví draft scénáře.
      operationId: updateScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/scenario.schema.json'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: './schemas/scenario.schema.json'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Scenarios]
      summary: Smaže scénář, pokud není spuštěný.
      operationId: deleteScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Smazáno
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/start:
    post:
      tags: [Runtime]
      summary: Spustí validovaný scénář.
      operationId: startScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCommandRequest'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/pause:
    post:
      tags: [Runtime]
      summary: Pozastaví běžící scénář.
      operationId: pauseScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCommandRequest'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/resume:
    post:
      tags: [Runtime]
      summary: Obnoví pozastavený scénář.
      operationId: resumeScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCommandRequest'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/stop:
    post:
      tags: [Runtime]
      summary: Zastaví scénář.
      operationId: stopScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCommandRequest'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/reset:
    post:
      tags: [Runtime]
      summary: Resetuje scénář do READY stavu.
      operationId: resetScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCommandRequest'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/step:
    post:
      tags: [Runtime]
      summary: Provede jeden step v režimu krokování.
      operationId: stepScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCommandRequest'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/faults:
    post:
      tags: [Faults]
      summary: Přidá fault injection do scénáře.
      operationId: addFault
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/fault-injection.schema.json'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: './schemas/fault-injection.schema.json'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    get:
      tags: [Faults]
      summary: Vrátí faults pro scénář.
      operationId: listFaults
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/scenarios/{scenarioId}/faults/{faultId}:
    delete:
      tags: [Faults]
      summary: Odstraní fault injection.
      operationId: deleteFault
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: Identifikátor scénáře.
          schema:
            type: string
            format: uuid
        - name: faultId
          in: path
          required: true
          description: Identifikátor fault injection.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Smazáno
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
