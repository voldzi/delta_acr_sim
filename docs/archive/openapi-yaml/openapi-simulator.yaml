        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/runtime/blocks:
    get:
      tags: [Runtime]
      summary: Vrátí dostupné simulační bloky.
      operationId: getRuntimeBlocks
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocksResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/runtime/publisher:
    get:
      tags: [Publisher]
      summary: Vrátí stav publisheru pro runtime.
      operationId: getRuntimePublisher
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/publisher/test-connection:
    post:
      tags: [Publisher]
      summary: Otestuje spojení na COP nebo mock endpoint.
      operationId: testPublisherConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/publisher-config.schema.json'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherTestResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/publisher/send-sample:
