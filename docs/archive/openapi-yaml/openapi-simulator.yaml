        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/operations/summary:
    get:
      tags: [Operations]
      summary: Lehky sanitizovany provozni souhrn pro SIM Operations Center.
      operationId: getOperationsSummary
      responses:
        '200':
          description: Uspesna odpoved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/operations/provider-details:
    get:
      tags: [Operations]
      summary: Chraneny server-side snapshot detailu provideru pro SIM Operations Center.
      operationId: getOperationsProviderDetails
      parameters:
        - name: includeDetails
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: includeObservability
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Uspesna odpoved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsProviderDetails'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe.
      operationId: liveHealth
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe.
      operationId: readyHealth
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /health/dependencies:
    get:
      tags: [Health]
      summary: Dependency health.
      operationId: dependenciesHealth
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependenciesHealthResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus-style metrics endpoint.
      operationId: metrics
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Standardizovaná chybová odpověď.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, RATE_LIMITED, SOURCE_REVOKED, CONFLICT, INTERNAL_ERROR, DEPENDENCY_UNAVAILABLE]
            message:
              type: string
            details:
              type: array
              items:
                type: object
            correlationId:
              type: string
              format: uuid
    ScenarioResponse:
      type: object
      required: [scenarioId, status, createdAt]
      properties:
        scenarioId:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, READY, RUNNING, PAUSED, STOPPED, ERROR]
        createdAt:
          type: string
          format: date-time
    ScenarioListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: './schemas/scenario.schema.json'
    DeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
    RuntimeCommandRequest:
      type: object
      properties:
        dryRun:
          type: boolean
        reason:
          type: string
    RuntimeStatus:
      type: object
      required: [state, generatedEvents, publishedEvents, queuedEvents]
      properties:
        scenarioId:
          type: string
          format: uuid
        runtimeId:
          type: string
          format: uuid
        state:
          type: string
          enum: [DRAFT, READY, RUNNING, PAUSED, STOPPED, ERROR]
        startedAt:
          type: string
          format: date-time
        generatedEvents:
          type: integer
          minimum: 0
        publishedEvents:
          type: integer
          minimum: 0
        queuedEvents:
          type: integer
          minimum: 0
    MetricsResponse:
      type: object
      additionalProperties:
        type: number
    BlocksResponse:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: './schemas/scenario-block.schema.json'
    FaultListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: './schemas/fault-injection.schema.json'
    PublisherStatus:
      type: object
      required: [mode, queueSize, deadLetterSize, publishingEnabled]
      properties:
        mode:
          type: string
          enum: [DRY_RUN, MOCK, LIVE]
        queueSize:
          type: integer
          minimum: 0
        deadLetterSize:
          type: integer
          minimum: 0
        publishingEnabled:
          type: boolean
        lastSuccessAt:
          type: string
          format: date-time
        lastFailureAt:
          type: string
          format: date-time
    PublisherTestResponse:
      type: object
      properties:
        ok:
          type: boolean
        mode:
          type: string
        latencyMs:
          type: integer
    PublisherSendResponse:
      type: object
      properties:
        accepted:
          type: boolean
        dryRun:
          type: boolean
        eventId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
    PublisherQueueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              queueId:
                type: string
              eventId:
                type: string
              state:
                type: string
                enum: [PENDING, SENDING, SENT, RETRY_SCHEDULED, DEAD_LETTER, DRY_RUN_VALIDATED]
              attempts:
                type: integer
    QueueActionRequest:
      type: object
      properties:
        queueIds:
          type: array
          items:
            type: string
        reason:
          type: string
    QueueActionResponse:
      type: object
      properties:
        accepted:
          type: boolean
        affectedCount:
          type: integer
    AiDraftRequest:
      type: object
      required: [prompt, purpose, allowedBlocks, limits]
      properties:
        prompt:
          type: string
        purpose:
          type: string
          enum: [LATENCY_TEST, LOAD_TEST, CONFLICT_TEST, DEGRADED_CONNECTIVITY, DEMO, DOCUMENTATION]
        allowedBlocks:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            maxObjects:
              type: integer
            maxDurationSeconds:
              type: integer
            externalProviderAllowed:
              type: boolean
        providerPreference:
          type: string
          enum: [openai, codex, local, mock, auto]
    ValidationResponse:
      type: object
      properties:
        schemaValid:
          type: boolean
        issues:
          type: array
          items:
            type: object
    RejectDraftRequest:
      type: object
      properties:
        reason:
          type: string
    AiDraftActionResponse:
      type: object
      properties:
        draftId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
    AiProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              enabled:
                type: boolean
              external:
                type: boolean
              healthy:
                type: boolean
    AiConfigRequest:
      type: object
      properties:
        providerMode:
          type: string
          enum: [openai, codex, local, mock, auto]
        externalProviderAllowed:
          type: boolean
    AiConfigResponse:
      type: object
      properties:
        saved:
          type: boolean
    OperationsSummary:
      type: object
      required: [alerts, contractVersion, deployment, generatedAt, publisher, runtime, scenarios, services, status]
      properties:
        contractVersion:
          type: string
          const: sim-operations-summary-v1
        generatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ok, degraded, critical, unknown]
        deployment:
          type: object
          required: [adapterVersion, publisherMode, sourceSystemId]
          properties:
            adapterVersion:
              type: string
            publisherMode:
              type: string
              enum: [DRY_RUN, MOCK, LIVE]
            sourceSystemId:
              type: string
        runtime:
          $ref: '#/components/schemas/RuntimeStatus'
        publisher:
          $ref: '#/components/schemas/PublisherStatus'
        scenarios:
          type: object
          required: [active, draft, paused, ready, running, stopped, total]
          properties:
            active:
              type: integer
              minimum: 0
            draft:
              type: integer
              minimum: 0
            paused:
              type: integer
              minimum: 0
            ready:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            stopped:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        services:
          type: array
          items:
            $ref: '#/components/schemas/OperationsServiceSummary'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/OperationsAlert'
        operationalCheck:
          type: object
          properties:
            finishedAt:
              type: string
              format: date-time
            status:
              type: string
            summary:
              type: string
    OperationsProviderDetails:
      type: object
      required: [contractVersion, flightData, generatedAt, safetyData, situationData, takGateway, warnings]
      properties:
        contractVersion:
          type: string
          const: sim-operations-provider-details-v1
        generatedAt:
          type: string
          format: date-time
        flightData:
          $ref: '#/components/schemas/OperationsProviderSection'
        situationData:
          $ref: '#/components/schemas/OperationsProviderSection'
        safetyData:
          $ref: '#/components/schemas/OperationsProviderSection'
        takGateway:
          $ref: '#/components/schemas/OperationsProviderSection'
        warnings:
          type: array
          items:
            type: string
    OperationsProviderSection:
      type: object
      description: Server-side provider payloads used by the authenticated SIM operator UI.
      additionalProperties: false
      properties:
        health:
          type: object
          additionalProperties: true
        layers:
          type: object
          additionalProperties: true
        sources:
          type: object
          additionalProperties: true
        config:
          type: object
          additionalProperties: true
        tracks:
          type: object
          additionalProperties: true
        features:
          type: object
          additionalProperties: true
        observability:
          type: object
          required: [latencyMs, payload]
          properties:
            latencyMs:
              type: integer
              minimum: 0
            payload:
              type: object
              additionalProperties: true
    OperationsServiceSummary:
      type: object
      required: [enabledSources, label, latencyMs, lifecycle, productionReadiness, serviceId, status, qualityWarningCount, qualityWarnings, warningCount, warnings]
      properties:
        serviceId:
          type: string
        label:
          type: string
        lifecycle:
          type: string
          enum: [production, future]
          description: Production services are included in SIM readiness and SLO rollup; future services are diagnostic only.
        productionReadiness:
          type: boolean
          description: True when service health contributes to the production readiness rollup.
        status:
          type: string
          enum: [ok, degraded, critical, unknown]
        healthStatus:
          type: string
        latencyMs:
          type: integer
          minimum: 0
        objectCount:
          type: integer
          minimum: 0
        enabledSources:
          type: array
          items:
            type: string
        warningCount:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
        qualityWarningCount:
          type: integer
          minimum: 0
        qualityWarnings:
          type: array
          items:
            $ref: '#/components/schemas/OperationsQualityWarning'
        cache:
          $ref: '#/components/schemas/OperationsCacheSummary'
        sharedCache:
          $ref: '#/components/schemas/OperationsSharedCacheSummary'
        dataFreshness:
          $ref: '#/components/schemas/OperationsDataFreshnessSummary'
    OperationsCacheSummary:
      type: object
      properties:
        entries:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
        hitRate:
          type: number
          minimum: 0
          maximum: 1
        lastErrorAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time
        misses:
          type: integer
          minimum: 0
        pressure:
          type: number
          minimum: 0
        state:
          type: string
        staleHits:
          type: integer
          minimum: 0
    OperationsSharedCacheSummary:
      type: object
      properties:
        available:
          type: boolean
        enabled:
          type: boolean
        errors:
          type: integer
          minimum: 0
        hitRate:
          type: number
          minimum: 0
          maximum: 1
        state:
          type: string
    OperationsDataFreshnessSummary:
      type: object
      properties:
        degradedSourceCount:
          type: integer
          minimum: 0
        newestImportAgeSeconds:
          type: integer
          minimum: 0
        oldestImportAgeSeconds:
          type: integer
          minimum: 0
        sourceCount:
          type: integer
          minimum: 0
        warningCount:
          type: integer
          minimum: 0
    OperationsAlert:
      type: object
      required: [category, code, detail, localized, severity, title]
      properties:
        action:
          type: string
        category:
          type: string
          enum: [technical, data_quality, simulation, operational_check]
        code:
          type: string
        detail:
          type: string
        impact:
          type: string
        localized:
          $ref: '#/components/schemas/LocalizedOperatorMessage'
        serviceId:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        title:
          type: string
    OperationsQualityWarning:
      type: object
      required: [action, code, detail, impact, localized, messages, sourceId, title, warningCount]
      properties:
        action:
          type: string
        code:
          type: string
        detail:
          type: string
        impact:
          type: string
        localized:
          $ref: '#/components/schemas/LocalizedOperatorMessage'
        messages:
          type: array
          items:
            type: string
        sourceId:
          type: string
        title:
          type: string
        warningCount:
          type: integer
          minimum: 0
    LocalizedText:
      type: object
      required: [cs, en]
      properties:
        cs:
          type: string
        en:
          type: string
    LocalizedOperatorMessage:
      type: object
      required: [detail, title]
      properties:
        action:
          $ref: '#/components/schemas/LocalizedText'
        detail:
          $ref: '#/components/schemas/LocalizedText'
        impact:
          $ref: '#/components/schemas/LocalizedText'
        title:
          $ref: '#/components/schemas/LocalizedText'
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        timestamp:
          type: string
          format: date-time
    DependenciesHealthResponse:
      type: object
      properties:
        status:
          type: string
        dependencies:
          type: object
          additionalProperties:
            type: string
security:
  - bearerAuth: []
