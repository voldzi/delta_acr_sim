      operationId: sendPublisherSample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/canonical-event-envelope.schema.json'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherSendResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/publisher/status:
    get:
      tags: [Publisher]
      summary: Vrátí stav publisheru.
      operationId: getPublisherStatus
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/publisher/queue:
