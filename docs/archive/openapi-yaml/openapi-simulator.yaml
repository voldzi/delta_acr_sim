          description: Identifikátor AI draftu.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDraftRequest'
      responses:
        '200':
          description: Úspěšná odpověď
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiDraftActionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
