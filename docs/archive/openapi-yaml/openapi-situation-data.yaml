    WeatherCameraDetail:
      type: object
      required: [contractVersion, providerId, sourceId, generatedAt, location, cameras, warnings]
      properties:
        contractVersion:
          type: string
          const: sim-weather-cameras-v1
        providerId:
          type: string
          const: sim.situation-data
        sourceId:
          type: string
          const: chmi_weather_webcams
        generatedAt:
          type: string
          format: date-time
        location:
          $ref: "#/components/schemas/WeatherCameraLocation"
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/WeatherCamera"
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false
    WeatherRadarFrameCatalog:
      type: object
      required: [contractVersion, providerId, sourceId, generatedAt, historyHours, frameStore, rasterSemantics, products, warnings]
      properties:
        contractVersion:
          type: string
          const: sim-weather-radar-frames-v1
        providerId:
          type: string
          const: sim.situation-data
        sourceId:
          type: string
          const: chmi_weather_radar
        generatedAt:
          type: string
          format: date-time
        historyHours:
          type: integer
        frameStore:
          type: object
          required: [enabled, mode, assetBasePath, cleanAssetBasePath]
          properties:
            enabled:
              type: boolean
            mode:
              type: string
              enum: [metadata_only, local_filesystem]
            assetBasePath:
              type: string
            cleanAssetBasePath:
              type: string
        rasterSemantics:
          type: object
          required: [projection, boundsWgs84, dataBoundsWgs84, sourceImageMayContainFrame, sourceImageMayContainEmbeddedLabels, cleanRasterAvailable, cleanMethod, cleanCropInsetPixels]
          properties:
            projection:
              type: string
              const: EPSG:3857
            boundsWgs84:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: number
            dataBoundsWgs84:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: number
            sourceImageMayContainFrame:
              type: boolean
            sourceImageMayContainEmbeddedLabels:
              type: boolean
            cleanRasterAvailable:
              type: boolean
            cleanMethod:
              type: string
              enum: [server_crop_to_data_bounds]
            cleanCropInsetPixels:
              type: integer
        products:
          type: array
          items:
            type: object
            required: [productId, layer, providerLayerId, catalogLayerId, label, description, contentType, updateCadenceSeconds, validForSeconds, styleHint, forecastArchive, frames]
            properties:
              productId:
                type: string
              layer:
                $ref: "#/components/schemas/LayerId"
              providerLayerId:
                type: string
              catalogLayerId:
                type: string
              label:
                type: string
              description:
                type: string
              contentType:
                type: string
              updateCadenceSeconds:
                type: integer
              validForSeconds:
                type: integer
              styleHint:
                type: string
              forecastArchive:
                type: boolean
              forecastHorizonMinutes:
                type: integer
              colorScaleUrl:
                type: string
              frames:
                type: array
                items:
                  type: object
                  required: [frameId, productId, observedAt, sourceUrl, sourceRevision, contentType, sourceImageMayContainFrame, sourceImageMayContainEmbeddedLabels, cleanRasterAvailable, boundsWgs84, dataBoundsWgs84, stored]
                  properties:
                    frameId:
                      type: string
                    productId:
                      type: string
                    observedAt:
                      type: string
                      format: date-time
                    validUntil:
                      type: string
                      format: date-time
                    sourceUrl:
                      type: string
                    sourceRevision:
                      type: string
                    contentType:
                      type: string
                    sourceImageMayContainFrame:
                      type: boolean
                    sourceImageMayContainEmbeddedLabels:
                      type: boolean
                    cleanRasterAvailable:
                      type: boolean
                    cleanUrl:
                      type: string
                    cleanStored:
                      type: boolean
                    cleanBoundsWgs84:
                      type: array
                      minItems: 4
                      maxItems: 4
                      items:
                        type: number
                    cleanMethod:
                      type: string
                      enum: [server_crop_to_data_bounds]
                    boundsWgs84:
                      type: array
                      minItems: 4
                      maxItems: 4
                      items:
                        type: number
                    dataBoundsWgs84:
                      type: array
                      minItems: 4
                      maxItems: 4
                      items:
                        type: number
                    stored:
                      type: boolean
                    localUrl:
                      type: string
        warnings:
          type: array
          items:
            type: string
    SourceHealthStatus:
      type: object
      required: [sourceId, status, warnings]
      properties:
        sourceId:
          $ref: "#/components/schemas/SourceId"
        status:
          type: string
          enum: [ok, degraded]
        backend:
          type: string
          enum: [unconfigured, local-postgis, patroni-postgis, external-postgis]
