          additionalProperties: true
        distanceM:
          type: integer
        durationSeconds:
          type: integer
        snap:
          type: object
          additionalProperties: true
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        quality:
          type: object
          required: [mode, confidence, graphEdgesScanned, graphEdgesUsed, routingModelVersion]
          properties:
            mode:
              type: string
              enum: [osm_graph, direct_fallback]
            confidence:
