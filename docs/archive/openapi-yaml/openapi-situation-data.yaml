          type: integer
        boundaryFeatureCount:
          type: integer
        boundaryLevels:
          type: array
          items:
            type: string
        boundaryLastImportAt:
          type: string
          format: date-time
        boundaryLastImportAgeSeconds:
          type: integer
        warnings:
          type: array
          items:
            type: string
    SituationObservability:
      type: object
      properties:
        serviceId:
          type: string
          const: situation-data-api
        generatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ok, degraded]
        cache:
          type: object
          additionalProperties: true
        sharedCache:
          type: object
          additionalProperties: true
        sourceCaches:
          type: array
          items:
            type: object
            additionalProperties: true
        dataFreshness:
          type: object
          additionalProperties: true
        environmentGrid:
          type: object
          description: Cataloged grid/field layer health, stable WGS84 grid alignment and upstream status.
          additionalProperties: true
        boundaryReadModel:
          type: object
