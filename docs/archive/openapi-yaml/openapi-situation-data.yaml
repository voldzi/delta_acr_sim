          additionalProperties: true
        sourceHealth:
          type: array
          items:
            type: object
            properties:
              sourceId:
                $ref: "#/components/schemas/SourceId"
              status:
                type: string
              backend:
                type: string
              objectCount:
                type: integer
              lastImportAt:
                type: string
                format: date-time
              lastImportAgeSeconds:
                type: integer
              boundaryFeatureCount:
                type: integer
              boundaryLevels:
                type: array
                items:
                  type: string
              boundaryLastImportAt:
                type: string
                format: date-time
              boundaryLastImportAgeSeconds:
                type: integer
              warningCount:
                type: integer
    SituationFeatureCollection:
      type: object
      required: [contractVersion, type, generatedAt, source, query, summary, features, sources, warnings]
      properties:
        contractVersion:
          type: string
          const: cop-situation-source-v1
        type:
          type: string
          const: FeatureCollection
        generatedAt:
          type: string
          format: date-time
        source:
          type: object
          properties:
            sourceId:
              type: string
              const: situation-data-api
            sourceType:
              type: string
              const: PUBLIC_SITUATION_AGGREGATE
            generatedAt:
              type: string
              format: date-time
        query:
          type: object
          properties:
            bbox:
              $ref: "#/components/schemas/BoundingBox"
            layers:
              type: array
              items:
                $ref: "#/components/schemas/LayerId"
            limit:
              type: integer
            sources:
              type: array
              items:
                $ref: "#/components/schemas/SourceId"
        summary:
          type: object
          properties:
            featureCount:
              type: integer
            sourceCount:
              type: integer
            staleFeatureCount:
              type: integer
            warningCount:
              type: integer
        features:
          type: array
          items:
            $ref: "#/components/schemas/SituationFeature"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDescriptor"
        warnings:
          type: array
          items:
            type: string
    SituationFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: string
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [Point, LineString, Polygon, MultiPolygon]
            coordinates: {}
        properties:
          type: object
          required: [featureId, layer, category, label, sourceId, observedAt, confidence, stale, severity, license]
          properties:
            featureId:
              type: string
            layerId:
              type: string
              description: Recommended COM catalog layer id, e.g. public.mobile.network.
            providerId:
              type: string
              const: sim.situation-data
            providerLayerId:
              type: string
            layer:
              $ref: "#/components/schemas/LayerId"
            category:
              type: string
            label:
              type: string
            labelLocalized:
              type: object
              additionalProperties:
                type: string
            summaryLocalized:
              type: object
              additionalProperties:
                type: string
            sourceId:
              $ref: "#/components/schemas/SourceId"
            source:
              type: string
            sourceName:
              type: string
            observedAt:
              type: string
              format: date-time
            validFrom:
              type: string
              format: date-time
            validUntil:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            confidence:
              type: number
              minimum: 0
              maximum: 1
            stale:
              type: boolean
            severity:
              type: string
              enum: [info, advisory, warning, critical]
            license:
              type: object
              required: [name, attribution]
              properties:
                name:
                  type: string
                attribution:
                  type: string
                url:
                  type: string
            metrics:
              type: object
              additionalProperties: true
            tags:
              type: object
              additionalProperties:
                type: string
            rendering:
              type: object
              description: Provider-side rendering contract for geometries that are grid cells or raster extents rather than ordinary vector polygons.
              properties:
                mode:
                  type: string
                  enum: [feature, grid_field, vector_field, raster_overlay]
                geometryRole:
                  type: string
                  enum: [feature_geometry, grid_cell, raster_extent, wind_vector]
                valueMetric:
                  type: string
                unit:
                  type: string
                opacity:
                  type: number
                doNotRenderGeometryFill:
                  type: boolean
                fallbackPolicy:
                  type: string
                  enum: [hide_if_unsupported, hide_if_raster_overlay_unsupported]
            transportMode:
              type: string
              description: Normalized public-transport or road mode, e.g. bus, tram, train, metro, trolleybus, road.
            routeShortName:
              type: string
              description: Normalized route or line short name for transit vehicles.
            destination:
              type: string
              description: Normalized destination/headsign when provided by the source.
            delaySeconds:
              type: number
              description: Normalized delay in seconds when provided by the source.
            vehicleId:
              type: string
              description: Stable provider vehicle identifier for transit vehicles.
            tripId:
              type: string
              description: Provider trip identifier for transit vehicles.
            occupancyStatus:
              type: string
              description: Normalized GTFS-style occupancy status when provided by the source.
            occupancyPercent:
              type: number
              minimum: 0
              maximum: 100
              description: Vehicle occupancy estimate in percent when provided by the source.
            headingDeg:
              type: number
              minimum: 0
              maximum: 360
              description: Vehicle heading in degrees.
            speedMps:
              type: number
              description: Vehicle speed in metres per second.
            operator:
              type: string
            technology:
              oneOf:
                - $ref: "#/components/schemas/MobileCoverageTechnology"
                - type: string
                  enum: [mixed, unknown]
            quality:
              $ref: "#/components/schemas/MobileCoverageQuality"
            status:
              type: string
              enum: [ok, weak_signal, degraded_possible, outage_reported, unknown]
            basis:
              type: array
              items:
                type: string
            summary:
              type: string
            notices:
              type: array
              items:
                type: string
            dataQuality:
              type: string
              enum: [observed, modelled, mixed, unknown]
              description: Indicates whether the mobile assessment is based on measurements, modelled coverage, both, or insufficient inputs.
            adminLevel:
              type: integer
            name:
              type: string
            code:
              type: string
            countryCode:
              type: string
            areaName:
              type: string
            styleHint:
              type: string
            iconHint:
              type: string
            btsStatus:
              type: string
              enum: [operator_feed_unavailable, unverified, reported_outage, unknown]
              description: Status of the concrete BTS/operator feed. `operator_feed_unavailable` means SIM has no authorized BTS/NOC status.
            btsStatusSource:
              type: string
            operatorStatusAvailable:
              type: boolean
            estimatedSignalDbm:
              type: integer
            modelVersion:
              type: string
            generatedAt:
              type: string
              format: date-time
            resolutionM:
              type: integer
            demSource:
              type: string
            assumptions:
              type: object
              additionalProperties: true
            disclaimer:
              type: string
            providerProperties:
              type: object
              additionalProperties: true
    MobileCoverageMetadata:
      type: object
      required: [layerId, modelVersion, generatedAt, resolutionM, technologies, operators, qualityLevels, demSource, cacheTtlSeconds, disclaimer, assumptions]
      properties:
        layerId:
