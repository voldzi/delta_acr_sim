          const: MODELLED_ROUTING
        generatedAt:
          type: string
          format: date-time
        backend:
          type: string
          const: osm-postgis-graph
    RoutingFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: string
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type:
              type: string
