openapi: 3.1.0
info:
  title: CSM SIM Flight Data API
  version: 0.1.0
  description: API pro agregaci veřejných nebo licencovaných letových dat pro COM/server-side mapový kontext.
servers:
  - url: http://localhost:4010
    description: Lokální služba
  - url: https://sim.zeleznalady.cz/flight-data
    description: Veřejná cesta přes SIM reverse proxy
tags:
  - name: FlightTracks
  - name: Reference
  - name: Sources
  - name: Health
paths:
  /api/v1/cop/tracks:
    get:
      tags: [FlightTracks]
      summary: Kompatibilní projekce deduplikovaných letových tracků pro existující backend adapter.
      deprecated: true
      description: Nové integrace mají preferovat source-neutral COM mapový kontrakt a normalizovaná data z /api/v1/aircraft/positions.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeStale'
      responses:
        '200':
          description: Compatibility flight source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopTrackResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/aircraft/positions:
    get:
      tags: [FlightTracks]
      summary: Vrátí normalizované deduplikované letové tracky.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeStale'
      responses:
        '200':
          description: Flight track response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightTrackResponse'
  /api/v1/sources:
    get:
      tags: [Sources]
      summary: Vrátí dostupné zdroje a licenční metadata.
      responses:
        '200':
          description: Source list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceDescriptor'
  /api/v1/catalog:
    get:
      tags: [Sources]
      summary: Vrátí Flight Data provider katalog pro COM Map Catalog v1.
      description: Katalog odděluje uživatelské vrstvy flight.public.tracks a flight.reference.airports od technických upstream zdrojů.
      responses:
        '200':
          description: Provider map catalog metadata
          content:
            application/json:
              schema:
                type: object
                required: [contractVersion, providerId, generatedAt, status, layers, sources]
                properties:
                  contractVersion:
                    type: string
                    const: provider-map-catalog-v1
                  providerId:
                    type: string
                    const: sim.flight-data
                  generatedAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [online]
                  layers:
                    type: array
                    items:
                      type: object
                  sources:
                    type: array
                    items:
                      type: object
  /api/v1/config:
    get:
      tags: [Sources]
      summary: Vrátí aktuální non-secret konfiguraci Flight Data API.
      responses:
        '200':
          description: Public runtime configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightDataConfig'
  /api/v1/airports:
    get:
      tags: [Reference]
      summary: Vyhledá letiště.
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Airport list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Airport'
  /api/v1/airports/{ident}:
    get:
      tags: [Reference]
      summary: Vrátí letiště podle ICAO nebo IATA kódu.
      parameters:
        - name: ident
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Airport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airport'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/airspaces:
    get:
      tags: [Reference]
      summary: Vrátí referenční letecké prostory jako GeoJSON FeatureCollection.
      description: Cacheovaná referenční vrstva AIP/eAIP ENR 5.1 pro zakázané, omezené a nebezpečné prostory. Výstup je situační reference, ne navigační ani právně závazná letecká informace.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - name: type
          in: query
          description: Comma-separated airspace types.
          schema:
            type: string
            example: prohibited,restricted,danger
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Airspace GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirspaceFeatureCollection'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/uas-geozones:
    get:
      tags: [Reference]
      summary: Vrátí referenční UAS zeměpisné zóny jako GeoJSON FeatureCollection.
      description: Cacheovaná vrstva oficiálních AIM/ŘLP JSON datových sad pro UAS geoawareness. Výchozí konfigurace importuje jen vybrané vrstvy vhodné pro runtime API; velké balíčky mají být řešené importem do PostGIS/tile cache.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - name: layer
          in: query
          description: Comma-separated AIM publication/layer ids.
          schema:
            type: string
            example: LKR314A,LKR320A
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: UAS geozone GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UasGeozoneFeatureCollection'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/airspace-activations:
    get:
      tags: [Reference]
      summary: Vrátí aktuální aktivace vzdušných prostorů z AUP/UUP jako GeoJSON FeatureCollection.
      description: Dynamická vrstva AUP/UUP, kde SIM páruje TRA/TSA aktivace na dostupnou geometrii z importovaných AIM UAS zón.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - name: includeCancelled
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Airspace activation GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirspaceActivationFeatureCollection'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/aircraft-types:
    get:
      tags: [Reference]
      summary: Vyhledá typy letadel.
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Aircraft type list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AircraftType'
  /api/v1/aircraft-types/{designator}:
    get:
      tags: [Reference]
      summary: Vrátí typ letadla podle ICAO designátoru.
      parameters:
        - name: designator
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aircraft type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AircraftType'
        '404':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check.
      responses:
        '200':
          description: OK
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check.
      responses:
        '200':
          description: OK
components:
  parameters:
    Bbox:
      name: bbox
      in: query
      description: Bounding box `west,south,east,north`.
      schema:
        type: string
        example: 13.5,49.5,15.5,50.6
    Source:
      name: source
      in: query
      description: Comma-separated source list.
      schema:
        type: string
        example: mock
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 250
    IncludeStale:
      name: includeStale
      in: query
      schema:
        type: boolean
        default: false
  responses:
    Problem:
      description: Problem response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  correlationId:
                    type: string
  schemas:
    CopTrackResponse:
      type: object
      required: [contractVersion, source, summary, tracks, sources, warnings]
      properties:
        contractVersion:
          type: string
          const: cop-flight-source-v1
        source:
          type: object
          properties:
            sourceId:
              type: string
            sourceType:
              type: string
              const: PUBLIC_FLIGHT_AGGREGATE
            generatedAt:
              type: string
              format: date-time
        summary:
          $ref: '#/components/schemas/FlightTrackSummary'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/FlightTrack'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceDescriptor'
        warnings:
          type: array
          items:
            type: string
    FlightTrackResponse:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/FlightTrackSummary'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/FlightTrack'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceDescriptor'
        warnings:
          type: array
          items:
            type: string
    FlightTrackSummary:
      type: object
      properties:
        rawObservationCount:
          type: integer
        deduplicatedTrackCount:
          type: integer
        droppedWithoutPositionCount:
          type: integer
        staleTrackCount:
          type: integer
    FlightTrack:
      type: object
      required: [trackId, icao24, objectType, domain, lat, lon, position, lastSeenAt, sources, deduplication, quality]
      properties:
        trackId:
          type: string
        icao24:
          type: string
          pattern: '^[0-9a-f]{6}$'
        callsign:
          type: string
        registration:
          type: string
        objectType:
          type: string
          enum: [AIRCRAFT, UAV, UNKNOWN]
        domain:
          type: string
          const: AIR
        lat:
          type: number
        lon:
          type: number
        position:
          type: object
          required: [lat, lon]
          properties:
            lat:
              type: number
            lon:
              type: number
        altitudeM:
          type: number
        speedMps:
          type: number
        headingDeg:
          type: number
        verticalRateMps:
          type: number
        lastSeenAt:
          type: string
          format: date-time
        originCountry:
          type: string
        aircraft:
          $ref: '#/components/schemas/AircraftTypePartial'
        sources:
          type: array
          items:
            type: object
            properties:
              sourceId:
                type: string
              sourceRecordId:
                type: string
              fetchedAt:
                type: string
                format: date-time
              seenAt:
                type: string
                format: date-time
        deduplication:
          type: object
          properties:
            key:
              type: string
              const: icao24
            mergedRecordCount:
              type: integer
            primarySourceId:
              type: string
        quality:
          type: object
          properties:
            confidence:
              type: number
            stale:
              type: boolean
            positionAgeSeconds:
              type: integer
        metadata:
          type: object
    SourceDescriptor:
      type: object
      properties:
        sourceId:
          type: string
          enum: [mock, adsb_lol, opensky, local_adsb]
        label:
          type: string
        enabled:
          type: boolean
        mode:
          type: string
          enum: [live, mock, reference]
        priority:
          type: integer
        license:
          type: object
    FlightDataConfig:
      type: object
      properties:
        enabledSources:
          type: array
          items:
            type: string
            enum: [mock, adsb_lol, opensky, local_adsb]
        defaultArea:
          type: object
          properties:
            lat:
              type: number
            lon:
              type: number
            radiusNm:
              type: number
        cacheTtlSeconds:
          type: integer
        bboxCacheGridDegrees:
          type: number
        bboxCachePaddingDegrees:
          type: number
        staleIfErrorSeconds:
          type: integer
        cacheMaxEntries:
          type: integer
        staleAfterSeconds:
          type: integer
        requestTimeoutMs:
          type: integer
        providers:
          type: array
          items:
            type: object
            properties:
              sourceId:
                type: string
                enum: [mock, adsb_lol, opensky, local_adsb]
              baseUrl:
                type: string
              authConfigured:
                type: boolean
        referenceData:
          type: object
          properties:
            ourAirportsEnabled:
              type: boolean
            ourAirportsCountries:
              type: array
              items:
                type: string
            ourAirportsCacheTtlSeconds:
              type: integer
            aipAirspacesEnabled:
              type: boolean
            aipAirspacesCacheTtlSeconds:
              type: integer
            aipAirspacesSourceUrl:
              type: string
            uasGeozonesEnabled:
              type: boolean
            uasGeozonesLayerIds:
              type: array
              items:
                type: string
            uasGeozonesCacheTtlSeconds:
              type: integer
            uasGeozonesCatalogUrl:
              type: string
            airspaceActivationEnabled:
              type: boolean
            airspaceActivationCacheTtlSeconds:
              type: integer
            airspaceActivationBaseUrl:
              type: string
    Airport:
      type: object
      properties:
        ident:
          type: string
        iata:
          type: string
        name:
          type: string
        municipality:
          type: string
        countryCode:
          type: string
        type:
          type: string
        lat:
          type: number
        lon:
          type: number
        elevationFt:
          type: integer
        dataSource:
          type: string
    AirspaceFeatureCollection:
      type: object
      required: [type, contractVersion, generatedAt, features, source, summary, warnings]
      properties:
        type:
          type: string
          const: FeatureCollection
        contractVersion:
          type: string
          const: flight-airspace-reference-v1
        generatedAt:
          type: string
          format: date-time
        features:
          type: array
          items:
            $ref: '#/components/schemas/AirspaceFeature'
        source:
          type: object
          properties:
            sourceId:
              type: string
              const: czech_aip_airspaces
            label:
              type: string
            sourceUrl:
              type: string
            sourceSection:
              type: string
            loadedAt:
              type: string
              format: date-time
            warnings:
              type: array
              items:
                type: string
        summary:
          type: object
          properties:
            totalReferenceAirspaces:
              type: integer
            returnedAirspaces:
              type: integer
            notForNavigation:
              type: boolean
            geometryQuality:
              type: object
              additionalProperties:
                type: integer
        warnings:
          type: array
          items:
            type: string
    AirspaceFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: string
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: number
        properties:
          type: object
          properties:
            layerId:
              type: string
              const: flight.reference.airspaces
            providerId:
              type: string
              const: sim.flight-data
            providerLayerId:
              type: string
              const: flight.airspaces
            sourceId:
              type: string
              const: czech_aip_airspaces
            category:
              type: string
            label:
              type: string
            observedAt:
              type: string
              format: date-time
            stale:
              type: boolean
            confidence:
              type: number
            severity:
              type: string
              enum: [info, warning]
            airspaceId:
              type: string
            designator:
              type: string
            name:
              type: string
            airspaceType:
              type: string
              enum: [prohibited, restricted, danger, temporary_reserved, temporary_segregated, other]
            lowerLimit:
              type: string
            upperLimit:
              type: string
            verticalLimitText:
              type: string
            notForNavigation:
              type: boolean
            providerProperties:
              type: object
    UasGeozoneFeatureCollection:
      type: object
      required: [type, contractVersion, generatedAt, features, source, summary, warnings]
      properties:
        type:
          type: string
          const: FeatureCollection
        contractVersion:
          type: string
          const: flight-uas-geozone-reference-v1
        generatedAt:
          type: string
          format: date-time
        features:
          type: array
          items:
            type: object
        source:
          type: object
          properties:
            sourceId:
              type: string
              const: czech_uas_geozones
            catalogUrl:
              type: string
            importedLayerIds:
              type: array
              items:
                type: string
        summary:
          type: object
          properties:
            totalReferenceGeozones:
              type: integer
            returnedGeozones:
              type: integer
            notForNavigation:
              type: boolean
        warnings:
          type: array
          items:
            type: string
    AirspaceActivationFeatureCollection:
      type: object
      required: [type, contractVersion, generatedAt, features, source, summary, warnings]
      properties:
        type:
          type: string
          const: FeatureCollection
        contractVersion:
          type: string
          const: flight-airspace-activation-v1
        generatedAt:
          type: string
          format: date-time
        features:
          type: array
          items:
            type: object
        source:
          type: object
          properties:
            sourceId:
              type: string
              const: czech_aup_uup
            baseUrl:
              type: string
            validFrom:
              type: string
              format: date-time
            validTo:
              type: string
              format: date-time
        summary:
          type: object
          properties:
            activationCount:
              type: integer
            returnedActivations:
              type: integer
            cancelledCount:
              type: integer
            withGeometryCount:
              type: integer
            notForNavigation:
              type: boolean
        warnings:
          type: array
          items:
            type: string
    AircraftType:
      allOf:
        - $ref: '#/components/schemas/AircraftTypePartial'
        - type: object
          properties:
            dataSource:
              type: string
    AircraftTypePartial:
      type: object
      properties:
        typeDesignator:
          type: string
        designator:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        category:
          type: string
        engineType:
          type: string
        wakeTurbulenceCategory:
          type: string
        iconHint:
          type: string
          enum: [jet, turboprop, small_aircraft, helicopter, glider, uav, unknown]
