# Source-only opt-in overlay. No public port or network change. Defaults OFF.
# Root installs the existing PostgreSQL CA read-only in both target services
# using its reviewed deployment overlay before selecting production mode.
services:
  sim-api:
    environment:
      SIM_USER_DATA_ENABLED: ${SIM_USER_DATA_ENABLED:-false}
      SIM_USER_DATA_MODE: ${SIM_USER_DATA_MODE:-isolated-sim-user-data-v1}
      SIM_USER_DATA_DATABASE_URL: ${SIM_USER_DATA_DATABASE_URL:-}
      SIM_USER_DATA_ROOT: ${SIM_USER_DATA_ROOT:-/data/sim-user-data-v1}
      SIM_USER_DATA_ENVIRONMENT_ID: ${SIM_USER_DATA_ENVIRONMENT_ID:-}
      SIM_USER_DATA_RESET_EPOCH: ${SIM_USER_DATA_RESET_EPOCH:-}
      SIM_USER_DATA_TOKENS_NOT_BEFORE: ${SIM_USER_DATA_TOKENS_NOT_BEFORE:-}
      SIM_USER_DATA_OWNER_SECRET: ${SIM_USER_DATA_OWNER_SECRET:-}
      SIM_USER_DATA_COP_TOKEN: ${SIM_USER_DATA_COP_TOKEN:-}
      SIM_USER_DATA_COP_ACTOR_SECRET: ${SIM_USER_DATA_COP_ACTOR_SECRET:-}
      SIM_USER_DATA_ROUTER_ACTOR_SECRET: ${SIM_USER_DATA_ROUTER_ACTOR_SECRET:-}
      SIM_AI_ROUTER_SIM_TOKEN: ${SIM_AI_ROUTER_SIM_TOKEN:-}
      SIM_USER_DATA_GUARD_DATABASE_URL: ${SIM_USER_DATA_GUARD_DATABASE_URL:-}
      SIM_USER_DATA_CONTINUITY_BINDING: ${SIM_USER_DATA_CONTINUITY_BINDING:-}
  ai-router-api:
    environment:
      SIM_USER_HISTORY_ENABLED: ${SIM_USER_HISTORY_ENABLED:-false}
      SIM_USER_HISTORY_MODE: ${SIM_USER_HISTORY_MODE:-isolated-sim-user-data-v1}
      SIM_USER_DATA_ENVIRONMENT_ID: ${SIM_USER_DATA_ENVIRONMENT_ID:-}
      SIM_USER_DATA_RESET_EPOCH: ${SIM_USER_DATA_RESET_EPOCH:-}
      SIM_USER_DATA_TOKENS_NOT_BEFORE: ${SIM_USER_DATA_TOKENS_NOT_BEFORE:-}
      SIM_USER_DATA_ROUTER_ACTOR_SECRET: ${SIM_USER_DATA_ROUTER_ACTOR_SECRET:-}
      SIM_USER_HISTORY_GUARD_DATABASE_URL: ${SIM_USER_HISTORY_GUARD_DATABASE_URL:-}
      SIM_USER_HISTORY_CONTINUITY_BINDING: ${SIM_USER_HISTORY_CONTINUITY_BINDING:-}
  situation-data-api:
    environment:
      SIM_USER_DATA_RELAY_ENABLED: ${SIM_USER_DATA_RELAY_ENABLED:-false}
